[project]
name = "qh"
version = "0.2.0"
description = "Lean agentic harness tuned for Qwen3.x 27B on a local vLLM server"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pillow>=10",
    "pygobject>=3.46",
    "rich>=13",
    "prompt_toolkit>=3.0.40",
]

[project.scripts]
qh = "qh.cli:main"
qh-gui = "qh.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qh"]
